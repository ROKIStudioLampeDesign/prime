<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Couleurs de Prime</title>
    <!--
      Dev-only comparison page (npm run dev, then /mockups/accents.html): the real app in one
      phone-sized frame per palette, each frame repainted through the accent variables only.
      Not part of the production build (only index.html is an entry).
    -->
    <style>
      body {
        margin: 0;
        background: #111;
        color: #eee;
        font-family: system-ui, sans-serif;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 1;
        display: flex;
        flex-wrap: wrap;
        gap: 6px 16px;
        align-items: center;
        padding: 10px 16px;
        background: #000d;
        backdrop-filter: blur(8px);
      }
      header h1 {
        margin: 0;
        font-size: 18px;
      }
      .group {
        display: flex;
        gap: 4px;
      }
      .group button,
      .group a {
        border: 1px solid #555;
        background: #222;
        color: #eee;
        padding: 6px 10px;
        font: inherit;
        font-size: 14px;
        text-decoration: none;
        cursor: pointer;
      }
      .group .on {
        background: #eee;
        color: #111;
      }
      .group button:disabled {
        opacity: 0.4;
      }
      main {
        display: flex;
        flex-wrap: wrap;
        gap: 28px 20px;
        padding: 20px 16px 60px;
      }
      figure {
        margin: 0;
      }
      figcaption {
        font-size: 14px;
        margin-bottom: 6px;
      }
      figcaption strong {
        display: block;
        font-size: 16px;
      }
      .badge {
        font-size: 11px;
        padding: 1px 5px;
        margin-left: 4px;
        vertical-align: 2px;
        background: #333;
      }
      .sw {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        margin-right: 10px;
        font-family: ui-monospace, monospace;
        font-size: 12px;
        color: #bbb;
      }
      .sw i {
        width: 14px;
        height: 14px;
        display: inline-block;
        border: 1px solid #fff4;
      }
      .phone {
        overflow: hidden;
        border-radius: 28px;
        border: 3px solid #333;
        background: #020106;
      }
      .phone iframe {
        width: 390px;
        height: 844px;
        border: 0;
        transform-origin: 0 0;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Couleurs</h1>
      <div class="group" id="filters"></div>
      <div class="group" id="screens"></div>
      <div class="group" id="sizes"></div>
    </header>
    <main id="grid"></main>
    <script type="module" src="./accents.ts"></script>
  </body>
</html>

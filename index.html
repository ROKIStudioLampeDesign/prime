<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#020106" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f2efea" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Prime" />
    <meta
      name="description"
      content="Prime : suivi de la salle, de l’alimentation et du corps, hors connexion. Tes données restent sur ton téléphone."
    />
    <title>Prime</title>
  </head>
  <body>
    <!--
      Shown until the app has loaded (React replaces the content of #root): the logo on the page
      colour. Inline styles only, as the stylesheet isn't there yet.
    -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #020106;
      }
      #splash svg {
        width: 33vw;
        max-width: 160px;
        height: auto;
      }
      @media (prefers-color-scheme: light) {
        #splash {
          background: #f2efea;
        }
      }
    </style>
    <div id="root">
      <div id="splash" aria-label="Prime" role="img">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" aria-hidden="true">
          <rect width="512" height="512" fill="#ff2e8a" />
          <g fill="#020106">
            <rect x="64" y="232" width="384" height="48" />
            <rect x="120" y="136" width="64" height="240" />
            <rect x="328" y="136" width="64" height="240" />
            <rect x="80" y="176" width="40" height="160" />
            <rect x="392" y="176" width="40" height="160" />
          </g>
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
